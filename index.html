<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Cisterna</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Recharts -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800 selection:bg-blue-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;
        const { ResponsiveContainer, ComposedChart, Area, Line, XAxis, YAxis, Tooltip, CartesianGrid, Legend } = window.Recharts || {};

        // IMPOSTAZIONI REALI CISTERNA
        const ALTEZZA_MAX_CM = 62.5; 
        const LITRI_PER_CM = 8;
        const VOLUME_MAX_LITRI = 500;

        function App() {
            const [supabaseUrl, setSupabaseUrl] = useState(localStorage.getItem('water_supa_url') || '');
            const [supabaseKey, setSupabaseKey] = useState(localStorage.getItem('water_supa_key') || '');
            const [isConfigured, setIsConfigured] = useState(!!localStorage.getItem('water_supa_url'));

            const [timeRange, setTimeRange] = useState('today'); 
            
            // STATO IN TEMPO REALE (Indipendente dal tempo)
            const [currentFlow, setCurrentFlow] = useState(0);
            const [isActive, setIsActive] = useState(false);
            const [currentLevel, setCurrentLevel] = useState(0); 
            
            // STORICO (Dipendente dal tempo)
            const [totalLiters, setTotalLiters] = useState(0);
            const [history, setHistory] = useState([]);
            const [chartData, setChartData] = useState([]); 
            const [lastUpdate, setLastUpdate] = useState(null);
            const [error, setError] = useState(null);

            const handleSaveConfig = (e) => {
                e.preventDefault();
                localStorage.setItem('water_supa_url', supabaseUrl.trim());
                localStorage.setItem('water_supa_key', supabaseKey.trim());
                setIsConfigured(true);
                setError(null);
            };

            const handleResetConfig = () => {
                localStorage.removeItem('water_supa_url');
                localStorage.removeItem('water_supa_key');
                setIsConfigured(false);
                setHistory([]);
                setChartData([]);
                setCurrentFlow(0);
                setTotalLiters(0);
                setCurrentLevel(0);
                setIsActive(false);
            };

            const fetchData = useCallback(async () => {
                if (!isConfigured) return;

                try {
                    // 1. FETCH STATO ASSOLUTO (Livello, Flusso attuale) - Ignora il filtro data
                    const resLive = await fetch(`${supabaseUrl}?select=livello_cm,portata,in_funzione,creato_il&order=id.desc&limit=1`, {
                        method: 'GET',
                        cache: 'no-store',
                        headers: {
                            'apikey': supabaseKey,
                            'Authorization': `Bearer ${supabaseKey}`
                        }
                    });
                    
                    if (resLive.ok) {
                        const liveData = await resLive.json();
                        if (liveData && liveData.length > 0) {
                            setCurrentLevel(liveData[0].livello_cm || 0);
                            setCurrentFlow(liveData[0].portata || 0);
                            setIsActive(liveData[0].in_funzione || false);
                            setLastUpdate(new Date(liveData[0].creato_il.replace(' ', 'T')));
                        }
                    }

                    // 2. FETCH STORICO (Grafici e Litri) - Segue il filtro data
                    let start = new Date();
                    let end = new Date();
                    let isoStart = null;
                    let isoEnd = null;

                    if (timeRange === 'today') {
                        start.setHours(0, 0, 0, 0);
                        isoStart = start.toISOString();
                    } else if (timeRange === 'yesterday') {
                        start.setDate(start.getDate() - 1);
                        start.setHours(0, 0, 0, 0);
                        end.setDate(end.getDate() - 1);
                        end.setHours(23, 59, 59, 999);
                        isoStart = start.toISOString();
                        isoEnd = end.toISOString();
                    } else if (timeRange === 'week') {
                        start.setDate(start.getDate() - 7);
                        start.setHours(0, 0, 0, 0);
                        isoStart = start.toISOString();
                    }

                    let allFetchedData = [];
                    let currentOffset = 0;
                    const fetchLimit = 1000;
                    let keepFetching = true;

                    while (keepFetching) {
                        let url = `${supabaseUrl}?select=*&order=id.desc&creato_il=gte.${isoStart}`;
                        if (isoEnd) url += `&creato_il=lte.${isoEnd}`;
                        url += `&limit=${fetchLimit}&offset=${currentOffset}`;

                        const response = await fetch(url, {
                            method: 'GET',
                            cache: 'no-store',
                            headers: {
                                'apikey': supabaseKey,
                                'Authorization': `Bearer ${supabaseKey}`
                            }
                        });

                        if (!response.ok) throw new Error(`Errore: ${response.status}`);
                        const chunk = await response.json();
                        
                        if (chunk && chunk.length > 0) {
                            allFetchedData = [...allFetchedData, ...chunk];
                            if (chunk.length < fetchLimit) {
                                keepFetching = false; 
                            } else {
                                currentOffset += fetchLimit; 
                            }
                        } else {
                            keepFetching = false;
                        }
                    }
                    
                    const data = allFetchedData;

                    if (data && data.length > 0) {
                        let calculatedTotal = 0;
                        let peak = 0;
                        for (let i = data.length - 1; i >= 0; i--) {
                            const litri = Number(data[i].litri_caricati) || 0;
                            if (litri >= peak) {
                                peak = litri; 
                            } else {
                                calculatedTotal += peak; 
                                peak = litri; 
                            }
                        }
                        calculatedTotal += peak; 
                        
                        setTotalLiters(calculatedTotal);
                        setHistory(data);

                        const formattedForChart = data.map(item => {
                            const safeDateStr = item.creato_il.replace(' ', 'T');
                            const d = new Date(safeDateStr);
                            
                            const orarioStr = timeRange === 'week' 
                                ? d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit' }) + ' ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })
                                : d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
                            return {
                                orario: orarioStr,
                                portata: Number(item.portata),
                                litri: Number(item.litri_caricati)
                            };
                        }).reverse(); 
                        
                        setChartData(formattedForChart);
                        setError(null);
                    } else {
                        // Se non ci sono dati nello storico, azzera solo lo storico, NON IL LIVELLO!
                        setHistory([]);
                        setChartData([]);
                        setTotalLiters(0);
                    }
                } catch (err) {
                    setError("Impossibile connettersi al database. Verifica la rete.");
                }
            }, [supabaseUrl, supabaseKey, isConfigured, timeRange]);
            
            useEffect(() => {
                fetchData();
                let interval;
                if (isConfigured && timeRange === 'today') {
                    interval = setInterval(fetchData, 3000);
                }
                return () => {
                    if (interval) clearInterval(interval);
                };
            }, [fetchData, isConfigured, timeRange]);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            const stats = useMemo(() => {
                if (!history || history.length === 0) return null;
                const newest = history[0];
                const oldest = history[history.length - 1];
                const safeOldestStr = oldest.creato_il.replace(' ', 'T');
                const startDate = new Date(safeOldestStr);
                const safeNewestStr = newest.creato_il.replace(' ', 'T');
                const endDate = new Date(safeNewestStr);
                const formatTimeOnly = (d) => d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
                
                const activeReadings = history.filter(r => r.in_funzione);
                const activeCount = activeReadings.length;
                const maxFlow = Math.max(...history.map(r => Number(r.portata) || 0));
                const sumFlowActive = activeReadings.reduce((sum, r) => sum + (Number(r.portata) || 0), 0);
                const avgFlow = activeCount > 0 ? (sumFlowActive / activeCount) : 0;

                return {
                    startTime: formatTimeOnly(startDate),
                    endTime: formatTimeOnly(endDate),
                    total: history.length,
                    active: activeCount,
                    liters: totalLiters.toFixed(2),
                    maxFlow: maxFlow.toFixed(2),
                    avgFlow: avgFlow.toFixed(2)
                };
            }, [history, totalLiters]);

            const levelPercent = Math.min(100, Math.max(0, (currentLevel / ALTEZZA_MAX_CM) * 100));
            const litriResidui = Math.max(0, currentLevel * LITRI_PER_CM);

            if (!isConfigured) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="bg-white rounded-3xl shadow-xl p-8 max-w-md w-full border border-slate-100">
                            <h1 className="text-2xl font-bold text-center mb-2">Monitor Cisterna</h1>
                            <form onSubmit={handleSaveConfig} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">URL Tabella</label>
                                    <input type="url" required className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl" value={supabaseUrl} onChange={(e) => setSupabaseUrl(e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">Chiave API (anon)</label>
                                    <input type="password" required className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl" value={supabaseKey} onChange={(e) => setSupabaseKey(e.target.value)} />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl mt-2">Connetti</button>
                            </form>
                        </div>
                    </div>
                );
            }

            const isToday = timeRange === 'today';
            const statusTitle = isActive 
                ? (isToday ? 'Acqua in Ingresso' : 'Acqua in Ingresso (Fine Periodo)') 
                : (isToday ? 'Flusso Assente' : 'Flusso Assente (Fine Periodo)');
            const statusDesc = isActive
                ? (isToday ? 'La rete diretta sta alimentando il serbatoio.' : "L'impianto era attivo all'ultimo rilevamento del periodo.")
                : (isToday ? 'Nessuna fornitura idrica al momento.' : "Nessuna fornitura all'ultimo rilevamento del periodo.");

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-8 space-y-6">
                    <header className="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-gradient-to-br from-blue-500 to-blue-600 text-white rounded-xl shadow-sm"><i data-lucide="droplets"></i></div>
                            <h1 className="text-xl font-bold">Cisterna Casa</h1>
                        </div>
                        <button onClick={handleResetConfig} className="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-50 rounded-xl transition-all"><i data-lucide="settings"></i></button>
                    </header>

                    <div className="flex justify-center">
                        <div className="bg-slate-200 p-1 rounded-xl flex w-full sm:w-auto shadow-inner">
                            <button onClick={() => setTimeRange('today')} className={`flex-1 sm:px-8 py-2.5 text-sm font-bold rounded-lg ${timeRange === 'today' ? 'bg-white text-blue-600 shadow' : 'text-slate-500 hover:text-slate-700'}`}>Oggi</button>
                            <button onClick={() => setTimeRange('yesterday')} className={`flex-1 sm:px-8 py-2.5 text-sm font-bold rounded-lg ${timeRange === 'yesterday' ? 'bg-white text-blue-600 shadow' : 'text-slate-500 hover:text-slate-700'}`}>Ieri</button>
                            <button onClick={() => setTimeRange('week')} className={`flex-1 sm:px-8 py-2.5 text-sm font-bold rounded-lg ${timeRange === 'week' ? 'bg-white text-blue-600 shadow' : 'text-slate-500 hover:text-slate-700'}`}>7 Giorni</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white rounded-3xl shadow-sm border border-slate-100 flex flex-col items-center justify-center p-8 text-center relative min-h-[320px]">
                            <div className={`absolute top-5 right-5 flex items-center gap-2 text-xs font-bold px-3 py-1.5 rounded-full ${isActive ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500'}`}>
                                <div className={`w-2 h-2 rounded-full ${isActive ? 'bg-green-500 animate-pulse' : 'bg-slate-400'}`}></div>
                                {isActive ? 'ONLINE' : 'STANDBY'}
                            </div>
                            <div className={`w-32 h-32 rounded-full flex items-center justify-center mb-6 ${isActive ? 'bg-blue-50 text-blue-500' : 'bg-slate-50 text-slate-300'}`}>
                                {isActive ? <i data-lucide="waves" className="w-16 h-16 animate-bounce"></i> : <i data-lucide="power-off" className="w-16 h-16"></i>}
                            </div>
                            <h2 className="text-3xl font-extrabold text-slate-800 mb-2">{statusTitle}</h2>
                            <p className="text-slate-500 font-medium">{statusDesc}</p>
                        </div>

                        <div className="space-y-4 flex flex-col">
                            <div className="bg-white rounded-3xl shadow-sm p-6 border border-slate-100 flex items-center justify-between relative overflow-hidden">
                                <div className="absolute -right-4 -bottom-4 opacity-5 text-cyan-600"><i data-lucide="database" className="w-40 h-40"></i></div>
                                <div>
                                    <div className="flex items-center gap-2 text-cyan-500 mb-2 relative z-10">
                                        <i data-lucide="database" className="w-5 h-5"></i>
                                        <h3 className="font-semibold text-sm uppercase tracking-wider">Livello Cisterna</h3>
                                    </div>
                                    <div className="flex items-baseline gap-1 relative z-10">
                                        <span className="text-4xl font-black tracking-tight text-cyan-600">{currentLevel.toFixed(1)}</span>
                                        <span className="text-sm font-bold text-slate-400">cm</span>
                                    </div>
                                    <p className="text-sm font-bold text-cyan-600 mt-1 relative z-10">Volume: {litriResidui.toFixed(0)} / {VOLUME_MAX_LITRI} L</p>
                                    <p className="text-xs font-medium text-slate-500 mt-0.5 relative z-10">Capacità al {levelPercent.toFixed(0)}%</p>
                                </div>
                                
                                <div className="w-20 h-28 bg-slate-50 rounded-2xl border-[3px] border-slate-200 overflow-hidden relative shadow-inner z-10">
                                    <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-cyan-500 to-blue-400 transition-all duration-1000 ease-in-out" style={{ height: `${levelPercent}%` }}>
                                        <div className="w-full h-2 bg-white/30 absolute top-0"></div>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-white rounded-3xl shadow-sm p-6 border border-slate-100 flex flex-col justify-center">
                                    <div className="flex items-center gap-2 text-slate-400 mb-2"><i data-lucide="activity" className="w-5 h-5"></i><h3 className="font-semibold text-sm uppercase tracking-wider">Portata</h3></div>
                                    <div className="flex items-baseline gap-1">
                                        <span className={`text-3xl font-black tracking-tight ${isActive ? 'text-blue-600' : 'text-slate-300'}`}>{currentFlow.toFixed(1)}</span>
                                        <span className="text-xs font-bold text-slate-400">L/m</span>
                                    </div>
                                </div>
                                <div className="bg-white rounded-3xl shadow-sm p-6 border border-slate-100 flex flex-col justify-center relative overflow-hidden">
                                    <div className="flex items-center gap-2 text-blue-500 mb-2 relative z-10"><i data-lucide="glass-water" className="w-5 h-5"></i><h3 className="font-semibold text-sm uppercase tracking-wider">Caricati Oggi</h3></div>
                                    <div className="flex items-baseline gap-1 relative z-10">
                                        <span className={`text-3xl font-black tracking-tight ${totalLiters > 0 ? 'text-blue-600' : 'text-slate-300'}`}>{totalLiters.toFixed(1)}</span>
                                        <span className="text-xs font-bold text-slate-400">Litri</span>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white rounded-3xl shadow-sm p-6 border border-slate-100 flex-grow">
                                <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                                    <div className="flex items-center gap-2 text-slate-400"><i data-lucide="history" className="w-5 h-5"></i><h3 className="font-semibold text-sm uppercase tracking-wider">Ultime Letture</h3></div>
                                    {lastUpdate && isToday && (
                                        <span className="text-xs font-semibold text-green-500 bg-green-50 px-2 py-1 rounded-md flex items-center gap-1"><i data-lucide="check-circle-2" className="w-3 h-3"></i> {lastUpdate.toLocaleTimeString()}</span>
                                    )}
                                </div>
                                <div className="space-y-2">
                                    {history.length > 0 ? history.slice(0, 4).map((record) => {
                                        const safeDateStr = record.creato_il.replace(' ', 'T');
                                        return (
                                            <div key={record.id} className="flex justify-between items-center p-3 hover:bg-slate-50 rounded-xl transition-colors border border-transparent hover:border-slate-100">
                                                <span className="text-slate-400 font-mono text-sm">{new Date(safeDateStr).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}</span>
                                                <div className="flex gap-4">
                                                    <span className="font-bold text-cyan-600 w-12 text-right">{record.livello_cm ? Number(record.livello_cm).toFixed(0) : '0'} <span className="text-xs opacity-70">cm</span></span>
                                                    <span className={`font-bold w-16 text-right ${record.in_funzione ? 'text-blue-600' : 'text-slate-400'}`}>{Number(record.portata).toFixed(1)} <span className="text-xs opacity-70">L/m</span></span>
                                                    <span className="font-bold text-slate-600 w-16 text-right">{record.litri_caricati ? Number(record.litri_caricati).toFixed(1) : '0.0'} <span className="text-xs opacity-70">L</span></span>
                                                </div>
                                            </div>
                                        )
                                    }) : (
                                        <p className="text-slate-400 text-sm text-center py-6">Nessun evento registrato per questo periodo</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    {window.Recharts && chartData.length > 0 && (
                        <div className="bg-white rounded-3xl shadow-sm p-6 border border-slate-100 mt-6">
                            <div className="flex items-center gap-3 text-slate-700 mb-6 border-b border-slate-100 pb-4">
                                <div className="p-2 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="bar-chart-2" className="w-5 h-5"></i></div>
                                <h3 className="font-bold text-lg">Andamento Flusso e Accumulo</h3>
                            </div>
                            <div className="h-80 w-full">
                                <ResponsiveContainer width="100%" height="100%">
                                    <ComposedChart data={chartData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                                        <defs>
                                            <linearGradient id="colorLitri" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#0ea5e9" stopOpacity={0.3}/>
                                                <stop offset="95%" stopColor="#0ea5e9" stopOpacity={0}/>
                                            </linearGradient>
                                        </defs>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />
                                        <XAxis dataKey="orario" stroke="#94a3b8" fontSize={12} tickLine={false} axisLine={false} minTickGap={40} />
                                        <YAxis yAxisId="left" stroke="#3b82f6" fontSize={12} tickLine={false} axisLine={false} />
                                        <YAxis yAxisId="right" orientation="right" stroke="#0ea5e9" fontSize={12} tickLine={false} axisLine={false} />
                                        <Tooltip />
                                        <Legend wrapperStyle={{ paddingTop: '20px', fontSize: '14px', fontWeight: '600', color: '#475569' }} iconType="circle" />
                                        <Area yAxisId="right" type="monotone" dataKey="litri" name="Volume Accumulato" stroke="#0ea5e9" strokeWidth={2} fillOpacity={1} fill="url(#colorLitri)" activeDot={false} />
                                        <Line yAxisId="left" type="monotone" dataKey="portata" name="Portata" stroke="#3b82f6" strokeWidth={3} dot={false} />
                                    </ComposedChart>
                                </ResponsiveContainer>
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
